[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "book-rag"
version = "0.1.0"
description = "Retrieval-augmented generation project for book recommendations."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "python-dotenv==1.2.1",
    "hydra-core==1.3.2",
    "jinja2==3.1.2",
    "langchain==1.2.3",
    "langchain-core==1.2.7",
    "langchain-openai==1.1.7",
    "langchain-community==0.4.1",
    "pandas",
    "faiss-cpu==1.13.2",
    "chainlit==2.9.6",
    "fastapi==0.128.0",
    "uvicorn==0.40.0",
]

[project.optional-dependencies]
hf = [
    "langchain-huggingface==1.2.0",
    "sentence-transformers==5.2.0",
]

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
include = ["src*"]

[tool.setuptools.package-data]
"src.rag" = ["templates/*.jinja2"]
