name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  tests:
    name: Python Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: make install-hf

      - name: Run coverage
        run: make coverage

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build backend image target
        run: docker build --target backend -t book-rag-backend .

      - name: Build frontend image target
        run: docker build --target frontend -t book-rag-frontend .
