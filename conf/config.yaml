
# Deployment method configuration
defaults:
  - deployment: local # Select the deployment configuration (local or docker)
  - _self_

# Embedding model configuration
embeddings:
  strategy: openai # Select the embedding strategy (openai or sentence_transformers)
  model: text-embedding-3-small
  base_url: null # Optional base URL for OpenAI-compatible embedding API services

# Index configuration
index:
  from_scratch: false # If true, the index will be created from scratch, otherwise it will try to load an existing index
  data_path: data/books.csv
  columns_to_drop:
    - isbn13
    - isbn10
    - thumbnail
  # The path where the FAISS index will be stored and the name of the index
  path: data/faiss_index/
  name: books_index

# LLM configuration
llm:
  provider: openai # Only OpenAI and OpenAI-compatible chat providers are supported
  model: gpt-3.5-turbo
  base_url: null # Optional base URL for OpenAI-compatible chat API services

# RAG configuration
rag:
  retriever_k: 5 # Number of chunks to retrieve.

# Frontend configuration
frontend:
  title: Book recommandor system
  subtitle: Tell the system what kind of book you want, and it will search the catalog for a fitting recommendation.
  starters:
    - label: I want an epic fantasy with political intrigue, magic, and a large cast.
      message: I want an epic fantasy with political intrigue, magic, and a large cast.
    - label: Suggest a cozy mystery with a charming setting and an amateur sleuth.
      message: Suggest a cozy mystery with a charming setting and an amateur sleuth.
    - label: I want a literary novel about grief, family tension, and reinvention.
      message: I want a literary novel about grief, family tension, and reinvention.
    - label: Recommend science fiction about survival, isolation, or a hostile world.
      message: Recommend science fiction about survival, isolation, or a hostile world.
  timeout_seconds: 30
  rag_endpoint: http://127.0.0.1:8000/rag
